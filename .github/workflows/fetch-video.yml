name: fetch-video
on:
  push:
    paths: ['videos/queue.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: pip install -q yt-dlp && sudo apt-get install -y -qq ffmpeg >/dev/null
      - name: Fetch transcript, info and frames
        run: |
          while read -r url; do
            [ -z "$url" ] && continue
            id=$(yt-dlp --get-id "$url" 2>/dev/null || echo "")
            [ -z "$id" ] && { mkdir -p videos/_errors; yt-dlp --get-id "$url" > videos/_errors/last.txt 2>&1; continue; }
            d=videos/$id; [ -f "$d/info.json" ] && continue; mkdir -p "$d"
            yt-dlp --skip-download --write-info-json --write-subs --write-auto-subs --sub-langs "en.*,hi.*" --sub-format vtt -o "$d/v.%(ext)s" "$url" > "$d/log.txt" 2>&1 || true
            [ -f "$d/v.info.json" ] && python3 -c "import json,sys;j=json.load(open('$d/v.info.json'));json.dump({k:j.get(k) for k in ['title','channel','view_count','like_count','comment_count','duration','upload_date','description','tags']},open('$d/info.json','w'),indent=1)" && rm "$d/v.info.json"
            yt-dlp -f "worst[height>=360]/worst" -o "$d/video.%(ext)s" "$url" >> "$d/log.txt" 2>&1 && \
              mkdir -p "$d/frames" && f=$(ls $d/video.* | head -1) && \
              ffmpeg -loglevel error -i "$f" -vf "select='gt(scene,0.3)',scale=512:-1" -vsync vfr -frames:v 40 "$d/frames/s%03d.jpg" && rm -f "$f" || echo "video download failed" >> "$d/log.txt"
          done < videos/queue.txt
      - name: Commit
        run: |
          git config user.name "video-bot"; git config user.email "video-bot@users.noreply.github.com"
          git add -A; git diff --cached --quiet || (git commit -m "Add fetched video data" && git push)
